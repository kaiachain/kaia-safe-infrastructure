# https://github.com/KyleAMathews/docker-nginx/blob/master/nginx.conf
# https://linode.com/docs/web-servers/nginx/configure-nginx-for-optimized-performance/
# https://docs.gunicorn.org/en/stable/deploy.html

worker_processes 1;

events {
  worker_connections 2000; # increase if you have lots of clients
  accept_mutex off; # set to 'on' if nginx worker_processes > 1
  use epoll; # Enable epoll for Linux 2.6+
  # 'use kqueue;' to enable for FreeBSD, OSX
}

http {
    include mime.types;
    # fallback in case we can't determine a type
    default_type application/octet-stream;
    sendfile on;

    ## Reflected Origin for localhost dev wallets (yarn dev hitting Config API + /cfg/media/).
    map $http_origin $cfg_acao {
        default "";
        "~^https?://localhost(?::[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(?::[0-9]+)?$" $http_origin;
    }

    ## Transaction Service
    upstream txs_app_server {
      # ip_hash; # For load-balancing
      #
      # fail_timeout=0 means we always retry an upstream even if it failed
      # to return a good HTTP response
      server unix:/nginx-txs/gunicorn.socket fail_timeout=0;

      # for a TCP configuration
      # server web:8000 fail_timeout=0;
      keepalive 32;
    }

    ## Config service
    upstream cfg_app_server {
      ip_hash;  # For load-balancing
      # server cfg-web:8001 fail_timeout=0;
      server unix:/nginx-cfg/gunicorn.socket fail_timeout=0;
      #
      # fail_timeout=0 means we always retry an upstream even if it failed
      # to return a good HTTP response
      keepalive 32;
    }

    ## Client gateway
    upstream cgw_app_server {
      ip_hash;  # For load-balancing
      server cgw-web:3000 fail_timeout=0;
      #
      # fail_timeout=0 means we always retry an upstream even if it failed
      # to return a good HTTP response
      keepalive 32;
    }

    upstream events_app_server {
      ip_hash;  # For load-balancing
      server events-web:3000 fail_timeout=0;
      #
      # fail_timeout=0 means we always retry an upstream even if it failed
      # to return a good HTTP response
      keepalive 32;
    }

    upstream ui_server {
      ip_hash;  # For load-balancing
      server ui:8080 fail_timeout=0;
      #
      # fail_timeout=0 means we always retry an upstream even if it failed
      # to return a good HTTP response
      keepalive 32;
    }

    server {
        access_log off;
        listen 8000 deferred;
        charset utf-8;
        keepalive_timeout 75s;

        # https://thoughts.t37.net/nginx-optimization-understanding-sendfile-tcp-nodelay-and-tcp-nopush-c55cdd276765
        # tcp_nopush on;
        # tcp_nodelay on;

        gzip             on;
        gzip_min_length 1000;
        gzip_comp_level  2;
        # text/html is always included by default
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/rss+xml application/atom+xml application/rdf+xml;
        gzip_disable "MSIE [1-6]\.";

        ## Transaction service mounting point
        location /txs/static {
            alias /nginx-txs/staticfiles;
            expires 365d;
        }

        location /txs/ {
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    Host                $host;
            proxy_set_header    X-Forwarded-Prefix  /txs;
            # we don't want nginx trying to do something clever with
            # redirects, we set the Host: header above already.
            proxy_redirect off;
            proxy_pass http://txs_app_server/;

            # Use the client Host (e.g. localhost:8000); $server_name is often
            # empty here and breaks Django CSRF / absolute URL generation.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header              Front-End-Https   on;
        }

        ## Config service mounting point
        location /cfg/static {
            alias /nginx-cfg/staticfiles;
            expires 365d;
        }

        location /cfg/media/ {
            alias /nginx-cfg/media/;
            expires 365d;
            add_header Access-Control-Allow-Origin $cfg_acao always;
            add_header Vary Origin always;
        }

        location /cfg/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cfg_acao always;
                add_header Access-Control-Allow-Methods 'GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, Accept' always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                add_header Content-Type text/plain always;
                return 204;
            }

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
            add_header              Front-End-Https   on;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;

            add_header Access-Control-Allow-Origin $cfg_acao always;
            add_header Vary Origin always;

            # we don't want nginx trying to do something clever with
            # redirects, we set the Host: header above already.
            proxy_redirect off;
            proxy_pass http://cfg_app_server/;

            # They default to 60s. Increase to avoid WORKER TIMEOUT in web container
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
      }

      ## Client gateway mounting point (CORS mirrors /cfg/ so yarn dev on :3000 can call /cgw/)
      location /cgw/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cfg_acao always;
                add_header Access-Control-Allow-Methods 'GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, Accept, Origin, Cache-Control, Pragma, X-CSRFToken, Safe-Client-Api-Key, Safe-Client, Infura-Api-Key' always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                add_header Content-Type text/plain always;
                return 204;
            }

            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    Host                $host;
            # CGW redirects `/` to `Location: /api`. Without rewriting, the browser
            # resolves that to http://$host/api (Next.js UI) instead of under /cgw/.
            proxy_redirect ~*^https?://[^/]+(/api.*)$ /cgw$1;
            proxy_redirect ~*^(/api.*)$ /cgw$1;
            proxy_pass http://cgw_app_server/;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;

            add_header Access-Control-Allow-Origin $cfg_acao always;
            add_header Vary Origin always;

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header              Front-End-Https   on;
        }
      
      ## Events service mounting point
      location /events/ {
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    Host                $host;
            # we don't want nginx trying to do something clever with
            # redirects, we set the Host: header above already.
            proxy_redirect off;
            proxy_pass http://events_app_server/events/;

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header              Front-End-Https   on;
        }
      
      location / {
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    Host                $host;
            # we don't want nginx trying to do something clever with
            # redirects, we set the Host: header above already.
            proxy_redirect off;
            proxy_pass http://ui_server/;

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header              Front-End-Https   on;
        }

    }
}
